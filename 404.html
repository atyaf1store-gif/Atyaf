<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>الصفحة غير موجودة | متجر أطياف</title>

<style>

  padding:24px;
  background:#F8EACB;
  color:#20301C;
  font-family:Arial,sans-serif;
}

main{
  width:min(520px,100%);

  background:#FFFBF0;
  border:1px solid rgba(32,48,28,.15);
  border-radius:24px;
  padding:42px 24px;
  box-shadow:0 16px 45px rgba(32,48,28,.10);
}

h1{
  font-size:64px;
  margin:0;
  color:#A9793C;
}

h2{margin:8px 0 12px}

p{
  line-height:1.8;
  color:#596052;
}

a{
  display:inline-block;
  margin-top:14px;
  padding:12px 22px;
  border-radius:12px;
  background:#20301C;
  color:white;
  text-decoration:none;
  font-weight:700;
}
</style>
</head>

<body>
<main>
  <h1>404</h1>
