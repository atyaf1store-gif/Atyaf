    <div class="modal" id="policyModal"><div class="modalCard"><div class="panelHead"><h2 id="policyTitle"></h2><button class="close" onclick="closeModal('policyModal')">×</button></div><div id="policyContent" style="line-height:2;white-space:pre-wrap"></div></div></div>

    <script>
    const SUPABASE_URL="https://zgvkiqoxmtifuvgcmrqc.supabase.co";
    const SUPABASE_KEY="sb_publishable_sEmW4aedA_jNmXACWZUwIg_am6sMtdl";
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=id=>document.getElementById(id);
    let ADS=[],FEATURES=[],SCENTS=[],NAVIGATION=[],HOME_SECTIONS=[],SOCIALS=[],PRODUCT_SCENTS=[];
let PRODUCTS=[],CATEGORIES=[],GIFTS=[],BUNDLES=[],POLICIES=[],CART=JSON.parse(localStorage.getItem("atyaf_cart")||"[]"),FAV=JSON.parse(localStorage.getItem("atyaf_fav")||"[]"),ACTIVE="all",COUPON=null,SETTINGS={};

    function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function money(n){return new Intl.NumberFormat("ar-YE").format(Number(n)||0)+" "+(SETTINGS.currency||"ر.ي")}
    function toast(m){document.querySelector(".toast")?.remove();const x=document.createElement("div");x.className="toast";x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}
    function saveLocal(){localStorage.setItem("atyaf_cart",JSON.stringify(CART));localStorage.setItem("atyaf_fav",JSON.stringify(FAV));updateCounts()}
    function updateCounts(){$("cartCount").textContent=CART.reduce((s,x)=>s+x.qty,0);$("favCount").textContent=FAV.length}
    function finalPrice(p){return Math.max(0,(+p.price||0)*(1-(+p.discount_percent||0)/100))}
    async function load(){
     const queries=[
      sb.from("store_settings").select("*").limit(1).maybeSingle(),
      sb.from("categories").select("*").eq("is_active",true).order("sort_order"),
      sb.from("products").select("*,categories(name_ar)").eq("is_active",true).order("sort_order"),
      sb.from("gifts").select("*").eq("is_active",true).order("sort_order"),
      sb.from("bundles").select("*").eq("is_active",true).order("sort_order"),
      sb.from("reviews").select("*").eq("is_approved",true).order("created_at",{ascending:false}).limit(10),
      sb.from("payment_methods").select("*").eq("is_active",true).order("sort_order"),
      sb.from("policies").select("*").eq("is_active",true).order("title"),
      sb.from("branches").select("*").eq("is_active",true).order("sort_order"),
      sb.from("ads").select("*").eq("is_active",true).order("sort_order"),
      sb.from("store_features").select("*").eq("is_active",true).order("sort_order"),
      sb.from("scents").select("*").eq("is_active",true).order("sort_order"),
      sb.from("navigation_items").select("*").eq("is_active",true).order("sort_order"),
      sb.from("home_sections").select("*").eq("is_active",true).order("sort_order"),
      sb.from("social_links").select("*").eq("is_active",true).order("sort_order"),
      sb.from("product_scents").select("*")
     ];
     const results=await Promise.all(queries.map(q=>q.then(r=>r).catch(error=>({data:null,error}))));
     results.forEach((r,i)=>{if(r?.error)console.warn("ATYAF query",i,r.error.message||r.error)});
     SETTINGS=results[0]?.data||{};
     CATEGORIES=results[1]?.data||[];
     PRODUCTS=results[2]?.data||[];
     GIFTS=results[3]?.data||[];
     BUNDLES=results[4]?.data||[];
     POLICIES=results[7]?.data||[];
     ADS=results[9]?.data||[];
     FEATURES=results[10]?.data||[];
     SCENTS=results[11]?.data||[];
     NAVIGATION=results[12]?.data||[];
     HOME_SECTIONS=results[13]?.data||[];
     SOCIALS=results[14]?.data||[];
     PRODUCT_SCENTS=results[15]?.data||[];

     // Defaults guarantee that the storefront structure never disappears.
     if(!HOME_SECTIONS.length) HOME_SECTIONS=defaultHomeSections();
     if(!FEATURES.length) FEATURES=[
       {title_ar:"شحن سريع",description_ar:"خدمة توصيل حسب منطقتك",icon:"truck",sort_order:10},
       {title_ar:"تسوق بثقة",description_ar:"منتجات مختارة بعناية",icon:"star",sort_order:20},
       {title_ar:"خدمة العملاء",description_ar:"نحن هنا لخدمتك",icon:"rotate",sort_order:30}
     ];
     if(!NAVIGATION.length) NAVIGATION=[
       {location:"header",label_ar:"الرئيسية",link_type:"section",link_value:"home",sort_order:10},
       {location:"header",label_ar:"المنتجات",link_type:"section",link_value:"shop",sort_order:20},
       {location:"header",label_ar:"الفئات",link_type:"section",link_value:"categories",sort_order:30},
       {location:"header",label_ar:"الروائح",link_type:"section",link_value:"scents",sort_order:40},
       {location:"header",label_ar:"العروض",link_type:"section",link_value:"offers",sort_order:50}
     ];

     applySettings();
     renderDynamicHomepage();
     renderPayments(results[6]?.data||[]);
     renderPolicies();
     renderBranches(results[8]?.data||[]);
     updateCounts();
    }

    function defaultHomeSections(){
      return [
       {section_key:"hero",title_ar:"الرئيسية",sort_order:10,is_active:true},
       {section_key:"features",title_ar:"مميزات المتجر",sort_order:20,is_active:true},
       {section_key:"categories",title_ar:"الفئات",subtitle_ar:"تسوق حسب الفئة",sort_order:30,is_active:true},
       {section_key:"best_sellers",title_ar:"الأكثر مبيعاً",sort_order:40,is_active:true},
       {section_key:"scents",title_ar:"الروائح",subtitle_ar:"اختر طابعك المفضل",sort_order:50,is_active:true},
       {section_key:"featured",title_ar:"منتجات مميزة",sort_order:60,is_active:true},
       {section_key:"new_products",title_ar:"وصل حديثاً",sort_order:70,is_active:true},
       {section_key:"offers",title_ar:"العروض",sort_order:80,is_active:true},
       {section_key:"gifts",title_ar:"الهدايا",sort_order:90,is_active:true},
       {section_key:"bundles",title_ar:"الباقات",sort_order:100,is_active:true},
       {section_key:"reviews",title_ar:"آراء العملاء",sort_order:110,is_active:true}
      ];
    }

    function applySettings(){
 document.documentElement.style.setProperty("--brown",SETTINGS.primary_color||"#60391f");
 document.documentElement.style.setProperty("--gold",SETTINGS.gold_color||"#b88a50");
 document.body.style.fontFamily=(SETTINGS.font_family||"Tajawal")+", sans-serif";
     $("storeName").textContent=SETTINGS.store_name_ar||"متجر أطياف";$("storeEn").textContent=SETTINGS.store_name_en||"ATYAF STORE";$("footName").textContent=SETTINGS.store_name_ar||"متجر أطياف";$("footDesc").textContent=SETTINGS.description||"شكراً لاختياركم أطياف.";$("heroDesc").textContent=SETTINGS.description||$("heroDesc").textContent;$("announcement").textContent=SETTINGS.announcement||"أهلاً بك في متجر أطياف";
     if(SETTINGS.logo_url)$("logo").innerHTML=`<img src="${esc(SETTINGS.logo_url)}" alt="أطياف">`;
     const wa=(SETTINGS.whatsapp||"").replace(/\D/g,"");$("whatsapp").href=wa?`https://wa.me/${wa}`:"#";$("phone").href=SETTINGS.phone?`tel:${SETTINGS.phone}`:"#"
    }
    
function renderDynamicHomepage(){
 renderNavigation();renderHero();renderFeatures();renderHomeSections();
}
function renderNavigation(){
 const a=NAVIGATION.filter(x=>x.location==="header").sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
 $("dynamicNav").innerHTML=a.map(x=>`<button onclick="navGo('${esc(x.link_type)}','${esc(x.link_value||"")}')">${esc(x.label_ar)}</button>`).join("");
}
function navGo(type,val){
 if(type==="section"){
   if(val==="home"){window.scrollTo({top:0,behavior:"smooth"});return}
   const el=document.getElementById(val==="products"?"shop":val);if(el)el.scrollIntoView({behavior:"smooth"});return
 }
 if(type==="category"){ACTIVE=val;renderProducts();document.getElementById("shop")?.scrollIntoView({behavior:"smooth"});return}
 if(type==="url"&&val)location.href=val;
}
function activeAds(place){const n=new Date();return ADS.filter(x=>(x.placement||"hero")===place&&(!x.starts_at||n>=new Date(x.starts_at))&&(!x.ends_at||n<=new Date(x.ends_at)))}
function renderHero(){
 const a=activeAds("hero"),box=$("heroSlider");
 if(!a.length){
   box.innerHTML=`<div class="heroFallback"><div><h2>متجر أطياف</h2><p id="heroDescFallback">${esc(SETTINGS.description||"تجربة تسوق أنيقة ومنتجات مختارة بعناية.")}</p><button class="primary" onclick="document.getElementById('shop')?.scrollIntoView({behavior:'smooth'})">تسوق الآن</button></div></div>`;
   return;
 }
 box.innerHTML=a.map((x,i)=>`<div class="heroSlide ${i===0?"active":""}">${x.image_url?`<picture>${x.mobile_image_url?`<source media="(max-width:600px)" srcset="${esc(x.mobile_image_url)}">`:""}<img src="${esc(x.image_url)}" alt="${esc(x.title_ar||"إعلان أطياف")}"></picture>`:""}${x.title_ar?`<div class="slideOverlay"><div><h2>${esc(x.title_ar)}</h2><p>${esc(x.subtitle_ar||"")}</p>${x.link_url?`<button class="secondary" onclick="location.href='${esc(x.link_url)}'">${esc(x.button_text_ar||"تسوق الآن")}</button>`:""}</div></div>`:""}</div>`).join("")+`<div class="sliderDots">${a.map((_,i)=>`<button class="${i===0?"active":""}" onclick="showSlide(${i})"></button>`).join("")}</div>`;
 window._heroIndex=0;clearInterval(window._heroTimer);if(a.length>1)window._heroTimer=setInterval(()=>showSlide((window._heroIndex+1)%a.length),5000);
}
function showSlide(i){const b=$("heroSlider");if(!b)return;const ss=[...b.querySelectorAll(".heroSlide")],ds=[...b.querySelectorAll(".sliderDots button")];ss.forEach((x,n)=>x.classList.toggle("active",n===i));ds.forEach((x,n)=>x.classList.toggle("active",n===i));window._heroIndex=i}
function renderFeatures(){
 $("featuresBar").innerHTML=FEATURES.map(x=>`<div class="featureItem"><div class="featureIcon">${x.icon==="truck"?"🚚":x.icon==="rotate"?"↻":"✦"}</div><div><b>${esc(x.title_ar)}</b><small>${esc(x.description_ar||"")}</small></div></div>`).join("");
}
function sectionStyle(x){return x.font_family?` style="font-family:${esc(x.font_family)},sans-serif"`:""}
function sectionHead(x,allTarget=""){return `<div class="blockHead"${sectionStyle(x)}><div><h3>${esc(x.title_ar||"")}</h3>${x.subtitle_ar?`<small>${esc(x.subtitle_ar)}</small>`:""}</div>${allTarget?`<button onclick="document.getElementById('${allTarget}')?.scrollIntoView({behavior:'smooth'})">عرض الكل ‹</button>`:""}</div>`}
function emptyBlock(text){return `<div class="emptyState"><div class="emptyIcon">✦</div><b>${esc(text)}</b><small>يمكنك إضافة المحتوى من لوحة إدارة أطياف</small></div>`}
function renderHomeSections(){
 const root=$("dynamicHome");let html="";
 const sections=(HOME_SECTIONS.length?HOME_SECTIONS:defaultHomeSections()).filter(x=>x.is_active!==false).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
 sections.filter(x=>!["hero","features"].includes(x.section_key)).forEach(x=>{
  if(x.section_key==="categories") html+=renderCategorySection(x);
  else if(x.section_key==="scents") html+=renderScentSection(x);
  else if(["best_sellers","featured","new_products","offers"].includes(x.section_key)) html+=renderProductSection(x);
  else if(x.section_key==="gifts") html+=renderGiftSection(x);
  else if(x.section_key==="bundles") html+=renderBundleSection(x);
  else if(x.section_key==="reviews") html+=`<section class="homeBlock" id="reviews-section">${sectionHead(x)}<div class="horizontal" id="reviews"></div></section>`;
 });
 const mids=activeAds("middle");if(mids.length){const b=mids[0];html+=`<div class="dynamicBanner">${b.image_url?`<img src="${esc(b.image_url)}" ${b.link_url?`onclick="location.href='${esc(b.link_url)}'"`:""}>`:""}</div>`}
 root.innerHTML=html;
 renderProducts();renderGifts();renderBundles();
 sb.from("reviews").select("*").eq("is_approved",true).order("created_at",{ascending:false}).limit(10).then(r=>renderReviews(r.data||[])).catch(()=>renderReviews([]));
}
function renderCategorySection(x){return `<section class="homeBlock" id="categories">${sectionHead(x)}<div class="categoryGrid">${CATEGORIES.length?CATEGORIES.map(c=>`<button class="categoryTile" onclick="ACTIVE='${c.id}';renderProducts();document.getElementById('shop')?.scrollIntoView()">${c.image_url?`<img src="${esc(c.image_url)}" alt="${esc(c.name_ar)}">`:`<div class="categoryPlaceholder">${esc(c.name_ar)}</div>`}<b>${esc(c.name_ar)}</b></button>`).join(""):emptyBlock("لا توجد فئات مضافة حالياً")}</div></section>`}
function renderScentSection(x){return `<section class="homeBlock" id="scents">${sectionHead(x)}<div class="scentRow">${SCENTS.length?SCENTS.map(c=>`<button class="scentBtn" onclick="filterScent('${c.id}')">${c.image_url?`<img class="scentPic" src="${esc(c.image_url)}">`:`<span class="scentPic">✦</span>`}<span>${esc(c.name_ar)}</span></button>`).join(""):emptyBlock("لا توجد روائح مضافة حالياً")}</div></section>`}
function filterScent(id){window._scentFilter=PRODUCT_SCENTS.filter(x=>x.scent_id===id).map(x=>x.product_id);renderProducts();document.getElementById("shop")?.scrollIntoView({behavior:"smooth"})}
function renderProductSection(x){return `<section class="homeBlock productSection" id="${x.section_key==="featured"?"shop":x.section_key}">${sectionHead(x,x.section_key==="featured"?"shop":"")}<div class="products" id="products-${x.section_key}"></div></section>`}
function productsForSection(k){
 if(k==="best_sellers"){const a=PRODUCTS.filter(p=>p.is_best_seller);return a.length?a:PRODUCTS.slice(0,10)}
 if(k==="featured"){const a=PRODUCTS.filter(p=>p.is_featured);return a.length?a:PRODUCTS}
 if(k==="new_products"){const a=PRODUCTS.filter(p=>p.is_new);return a.length?a:PRODUCTS.slice(0,10)}
 if(k==="offers")return PRODUCTS.filter(p=>+p.discount_percent>0)
 return PRODUCTS
}
function renderGiftSection(x){return `<section class="homeBlock" id="gifts">${sectionHead(x)}<div class="horizontal" id="giftCards"></div></section>`}
function renderBundleSection(x){return `<section class="homeBlock" id="bundles">${sectionHead(x)}<div class="horizontal" id="bundleCards"></div></section>`}
function renderCats(){if(!$("cats"))return;$("cats").innerHTML=`<button class="cat ${ACTIVE==="all"?"active":""}" onclick="setCat('all')">الكل</button><button class="cat ${ACTIVE==="offers"?"active":""}" onclick="setCat('offers')">العروض</button>`+CATEGORIES.map(c=>`<button class="cat ${ACTIVE===c.id?"active":""}" onclick="setCat('${c.id}')">${esc(c.name_ar)}</button>`).join("")}
    function setCat(x){ACTIVE=x;renderCats();renderProducts()}
    function filterSpecial(){ACTIVE="offers";renderCats();renderProducts();$("shop").scrollIntoView()}
    function renderProducts(){
 const q=$("search")?.value?.trim().toLowerCase()||"";
 const ids=window._scentFilter||null;
 ["best_sellers","featured","new_products","offers"].forEach(k=>{
   const el=document.getElementById("products-"+k);if(!el)return;
   let a=productsForSection(k).filter(p=>(!q||(p.name_ar||"").toLowerCase().includes(q)||(p.description||"").toLowerCase().includes(q)||(p.sku||"").toLowerCase().includes(q))&&(!ids||ids.includes(p.id)));
   el.innerHTML=a.length?a.slice(0,10).map(productCard).join(""):emptyBlock(k==="offers"?"لا توجد عروض حالياً":"لا توجد منتجات مضافة حالياً");
 });
}
function productCard(p){const fp=finalPrice(p);return `<article class="product"><div class="pic">${p.main_image_url?`<img src="${esc(p.main_image_url)}" alt="${esc(p.name_ar)}">`:"صورة المنتج"}</div><div class="badges">${+p.discount_percent>0?`<span class="badge">خصم ${p.discount_percent}%</span>`:""}${p.is_new?'<span class="badge gold">جديد</span>':""}</div><button class="fav" onclick="toggleFav('${p.id}')">${FAV.includes(p.id)?"♥":"♡"}</button><div class="info"><h4>${esc(p.name_ar)}</h4><div class="desc">${esc(p.short_description||p.description||"")}</div><div><span class="price">${money(fp)}</span>${+p.discount_percent>0?`<span class="old">${money(p.price)}</span>`:""}</div><button class="primary" ${p.stock<=0?"disabled":""} onclick="addCart('${p.id}')">${p.stock>0?"إضافة للسلة":"نفد المخزون"}</button></div></article>`}
    function toggleFav(id){FAV=FAV.includes(id)?FAV.filter(x=>x!==id):[...FAV,id];saveLocal();renderProducts()}
    function addCart(id){const p=PRODUCTS.find(x=>x.id===id);if(!p||p.stock<=0)return;const x=CART.find(x=>x.id===id);if(x){if(x.qty>=p.stock)return toast("لا توجد كمية إضافية");x.qty++}else CART.push({id,qty:1});saveLocal();toast("تمت الإضافة للسلة")}
    function openCart(){renderCart();$("cartDrawer").classList.add("show")}
    function openFav(){$("favItems").innerHTML=FAV.length?FAV.map(id=>{const p=PRODUCTS.find(x=>x.id===id);return p?`<div class="cartItem"><div>${p.main_image_url?`<img src="${esc(p.main_image_url)}">`:""}</div><div><b>${esc(p.name_ar)}</b><br>${money(finalPrice(p))}</div><button class="primary" onclick="addCart('${p.id}')">إضافة</button></div>`:""}).join(""):'<div class="empty">المفضلة فارغة</div>';$("favDrawer").classList.add("show")}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(x=>x.classList.remove("show"))}
    function renderCart(){CART=CART.filter(x=>PRODUCTS.some(p=>p.id===x.id));$("cartItems").innerHTML=CART.length?CART.map(x=>{const p=PRODUCTS.find(p=>p.id===x.id);return `<div class="cartItem"><div>${p.main_image_url?`<img src="${esc(p.main_image_url)}">`:""}</div><div><b>${esc(p.name_ar)}</b><br>${money(finalPrice(p))}<div class="qty"><button onclick="qty('${p.id}',-1)">−</button><b>${x.qty}</b><button onclick="qty('${p.id}',1)">+</button></div></div><button class="close" onclick="removeCart('${p.id}')">×</button></div>`}).join(""):'<div class="empty">السلة فارغة</div>';$("cartTotal").textContent=money(cartSubtotal());saveLocal()}
    function qty(id,n){const x=CART.find(x=>x.id===id),p=PRODUCTS.find(p=>p.id===id);if(!x)return;x.qty=Math.max(1,Math.min(p.stock,x.qty+n));renderCart()}
    function removeCart(id){CART=CART.filter(x=>x.id!==id);renderCart()}
    function cartSubtotal(){return CART.reduce((s,x)=>{const p=PRODUCTS.find(p=>p.id===x.id);return s+(p?finalPrice(p)*x.qty:0)},0)}
    function openCheckout(){if(!CART.length)return toast("السلة فارغة");closeDrawers();COUPON=null;$("checkoutTotal").textContent=money(cartSubtotal());$("checkoutModal").classList.add("show")}
    function closeModal(id){$(id).classList.remove("show")}
    async function applyCoupon(){const code=$("coCoupon").value.trim().toUpperCase();if(!code)return;const {data,error}=await sb.from("coupons").select("*").eq("code",code).eq("is_active",true).maybeSingle();if(error||!data)return toast("الكوبون غير صالح");const now=new Date();if(data.starts_at&&now<new Date(data.starts_at))return toast("الكوبون لم يبدأ بعد");if(data.ends_at&&now>new Date(data.ends_at))return toast("انتهت صلاحية الكوبون");if(data.usage_limit&&data.used_count>=data.usage_limit)return toast("انتهى استخدام الكوبون");if(cartSubtotal()<(+data.min_order_amount||0))return toast("قيمة الطلب أقل من الحد المطلوب");COUPON=data;$("checkoutTotal").textContent=money(calcTotal());toast("تم تطبيق الكوبون")}
    function calcTotal(){let total=cartSubtotal();if(COUPON){const d=COUPON.discount_type==="percentage"?total*(+COUPON.discount_value/100):+COUPON.discount_value;total-=Math.min(d,+COUPON.max_discount||d)}return Math.max(0,total)}
    async function submitOrder(){
     const name=$("coName").value.trim(),phone=$("coPhone").value.trim();if(!name||!phone)return toast("اكتب الاسم ورقم الهاتف");
     const subtotal=cartSubtotal(),total=calcTotal(),discount=subtotal-total;
     const order={customer_name:name,customer_phone:phone,customer_city:$("coCity").value.trim(),customer_address:$("coAddress").value.trim(),notes:$("coNotes").value.trim(),subtotal,discount_amount:discount,shipping_amount:0,total,coupon_code:COUPON?.code||null,payment_method_id:$("coPayment").value||null,status:"new",payment_status:"unpaid"};
     const {data:o,error}=await sb.from("orders").insert(order).select().single();if(error)return toast(error.message);
     const items=CART.map(x=>{const p=PRODUCTS.find(p=>p.id===x.id);return {order_id:o.id,product_id:p.id,product_name:p.name_ar,sku:p.sku||null,quantity:x.qty,unit_price:finalPrice(p),total_price:finalPrice(p)*x.qty}});
     const {error:ie}=await sb.from("order_items").insert(items);if(ie)return toast("تم إنشاء الطلب لكن حدث خطأ في تفاصيله");
     CART=[];saveLocal();closeModal("checkoutModal");toast("تم استلام طلبك رقم "+o.order_number);setTimeout(()=>{alert("رقم طلبك: "+o.order_number+"\nاحتفظ به لتتبع الطلب.")},300)
    }
    function renderGifts(){if(!$("giftCards"))return;$("giftCards").innerHTML=GIFTS.length?GIFTS.map(x=>`<div class="miniCard">${x.image_url?`<img src="${esc(x.image_url)}" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:""}<b>${esc(x.name_ar)}</b><p>${esc(x.description||"")}</p><span class="price">${money(x.price)}</span></div>`).join(""):'<div class="empty">لا توجد هدايا حالياً</div>'}
    function renderBundles(){if(!$("bundleCards"))return;$("bundleCards").innerHTML=BUNDLES.length?BUNDLES.map(x=>`<div class="miniCard">${x.image_url?`<img src="${esc(x.image_url)}" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:""}<b>${esc(x.name_ar)}</b><p>${esc(x.description||"")}</p><span class="price">${money(x.offer_price)}</span>${x.regular_price>x.offer_price?` <span class="old">${money(x.regular_price)}</span>`:""}</div>`).join(""):'<div class="empty">لا توجد باقات حالياً</div>'}
    function renderReviews(a){if(!$("reviews"))return;$("reviews").innerHTML=a.length?a.map(x=>`<div class="miniCard"><b>${esc(x.customer_name)}</b><div style="color:#b88a50">${"★".repeat(x.rating)}</div><p>${esc(x.comment||"")}</p></div>`).join(""):'<div class="empty">لا توجد تقييمات بعد</div>'}
    function renderPayments(a){$("coPayment").innerHTML='<option value="">اختر طريقة الدفع</option>'+a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}
    function renderPolicies(){$("policyLinks").innerHTML=POLICIES.map(x=>`<a href="#" onclick="showPolicy('${x.id}');return false">${esc(x.title)}</a>`).join("")}
    function showPolicy(id){const x=POLICIES.find(x=>x.id===id);if(!x)return;$("policyTitle").textContent=x.title;$("policyContent").textContent=x.content||"";$("policyModal").classList.add("show")}
    function renderBranches(a){$("branchLinks").innerHTML=a.map(x=>`<div style="font-size:12px;margin:7px 0">${esc(x.name)} — ${esc(x.address||"")}</div>`).join("")}
    function openTrack(){$("trackResult").innerHTML="";$("trackModal").classList.add("show")}
    async function trackOrder(){const no=$("trackNo").value.trim(),phone=$("trackPhone").value.trim();if(!no||!phone)return toast("أدخل رقم الطلب والهاتف");const {data,error}=await sb.from("orders").select("order_number,status,total,created_at").eq("order_number",no).eq("customer_phone",phone).maybeSingle();$("trackResult").innerHTML=error||!data?'<div class="empty">لم يتم العثور على الطلب</div>':`<div class="miniCard" style="margin-top:15px"><b>الطلب #${data.order_number}</b><p>الحالة: <strong>${esc(statusAr(data.status))}</strong></p><p>الإجمالي: ${money(data.total)}</p></div>`}
    function statusAr(s){return({new:"جديد",confirmed:"تم التأكيد",processing:"قيد التجهيز",ready:"جاهز",shipped:"تم الشحن",delivered:"تم التوصيل",completed:"مكتمل",cancelled:"ملغي"})[s]||s}
    $("year").textContent=new Date().getFullYear();updateCounts();load();
    </script>
    </body>
    </html>
